<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zombies Dev Plan</title>
  <!-- Fonts load when you're online. Offline, the page falls back to system fonts. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <!-- SITE VERSION: change this whenever you edit styles.css, data.js or app.js, so browsers
       fetch the new files instead of an old saved copy. Any new value works (e.g. the date). -->
  <script>window.SITE_VERSION = "2026-11-05.1";</script>
  <script>document.write('<link rel="stylesheet" href="styles.css?v=' + window.SITE_VERSION + '">');</script>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
  <!-- The page is drawn by app.js using the plan in data.js. -->
  <div id="app"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <script>
    document.write('<script src="data.js?v=' + window.SITE_VERSION + '"><\/script>');
    document.write('<script src="app.js?v=' + window.SITE_VERSION + '"><\/script>');
  </script>
</body>
</html>
